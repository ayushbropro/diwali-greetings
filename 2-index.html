<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Diwali</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:#22113f; }
body { font-family: Georgia, 'Times New Roman', serif; color:#fff;
  -webkit-user-select:none; user-select:none; touch-action:manipulation; }
#c3d { position:fixed; inset:0; display:block; }
#tapPill {
  position:fixed; left:50%; bottom:7vh; transform:translateX(-50%);
  z-index:35; padding:.85em 1.9em; border-radius:999px;
  background: linear-gradient(180deg,#ffd75e,#f5a623);
  color:#2a1503; font-size: clamp(1rem, 2.8vw, 1.3rem); font-weight:bold;
  animation: pulse 1.6s ease-out infinite;
  transition: opacity .5s; white-space:nowrap; cursor:pointer; border:none;
  font-family:inherit;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,200,80,.55); }
  70% { box-shadow: 0 0 0 22px rgba(255,200,80,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,200,80,0); }
}
#tapPill.hidden { opacity:0; pointer-events:none; }
#finale {
  position:fixed; inset:0; z-index:40;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding: 0 5vw;
  opacity:0; pointer-events:none; transition: opacity 1.6s ease;
  background: radial-gradient(ellipse at 50% 60%, rgba(10,4,24,.2) 0%, rgba(5,2,14,.72) 100%);
}
body[data-stage="5"] #finale { opacity:1; pointer-events:auto; }
#finale h1 {
  font-size: clamp(2.6rem, 9vw, 6rem); letter-spacing:.04em;
  background: linear-gradient(180deg, #fff3c4 0%, #ffd23e 38%, #ff9a1f 70%, #ff6a00 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter: drop-shadow(0 0 18px rgba(255,170,40,.55)) drop-shadow(0 4px 26px rgba(255,110,0,.35));
  transform: scale(.6); opacity:0;
}
body[data-stage="5"] #finale h1 { animation: pop 1.1s cubic-bezier(.2,1.5,.35,1) .5s forwards; }
@keyframes pop { to { transform:scale(1); opacity:1; } }
#finale .from {
  margin-top: 2.2vh; font-size: clamp(1.3rem, 4.2vw, 2.6rem);
  color:#ffe9b0; opacity:0; text-shadow: 0 0 14px rgba(255,190,90,.5);
}
body[data-stage="5"] #finale .from { animation: fadeUp 1.2s ease 1.6s forwards; }
#finale .names {
  margin-top: 1vh; font-size: clamp(1.6rem, 5.4vw, 3.4rem); color:#fff; opacity:0;
  text-shadow: 0 0 22px rgba(255,190,90,.85), 0 0 60px rgba(255,120,20,.4);
}
body[data-stage="5"] #finale .names { animation: fadeUp 1.2s ease 2.1s forwards; }
@keyframes fadeUp { from { opacity:0; transform: translateY(16px);} to { opacity:1; transform:none; } }
#replay {
  position:fixed; left:50%; bottom:6vh; transform:translateX(-50%); z-index:45;
  opacity:0; font-family:inherit; font-size: clamp(1rem, 2.6vw, 1.25rem);
  color:#2a1503; background: linear-gradient(180deg,#ffd75e,#f5a623);
  border:none; border-radius:999px; padding:.8em 2.2em; cursor:pointer;
  box-shadow: 0 6px 30px rgba(255,170,40,.45);
}
body[data-stage="5"] #replay { animation: fadeUp 1s ease 3s forwards; }
#bgmBtn {
  position:fixed; top:calc(2.5vh + env(safe-area-inset-top)); right:4vw; z-index:46;
  width:46px; height:46px; border-radius:50%;
  background:rgba(20,10,40,.55); border:1px solid rgba(255,200,100,.5);
  color:#ffe9b0; font-size:1.3rem; cursor:pointer; font-family:inherit;
  display:flex; align-items:center; justify-content:center; padding:0;
}
#hint {
  position:fixed; top:4vh; left:50%; transform:translateX(-50%); z-index:34;
  color:rgba(255,233,176,.75); font-size:clamp(.8rem,2vw,1rem); letter-spacing:.12em;
  text-transform:uppercase; transition:opacity 1s;
}
#sparkle { position:fixed; inset:0; width:100%; height:100%; z-index:39; pointer-events:none; opacity:0; transition:opacity .8s; }
body[data-stage="5"] #sparkle { opacity:1; }
body.sparkle-text #finale h1, body.sparkle-text #finale .from, body.sparkle-text #finale .names { visibility:hidden; }
body.sparkle-text #finale { background: rgba(4,2,12,.28); }
#picker {
  position:fixed; inset:0; z-index:50; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 50% 40%, #1a1030 0%, #070412 80%);
  text-align:center; padding:0 6vw;
}
body.picker #picker { display:flex; }
#picker .ptitle { font-size:clamp(1.3rem,4.5vw,2.2rem); color:#ffe9b0; margin-bottom:4vh;
  text-shadow:0 0 14px rgba(255,190,90,.4); }
#plist { display:flex; flex-direction:column; gap:1.6vh; width:min(88vw,420px); }
#plist button {
  font-family:inherit; font-size:clamp(1.05rem,3.4vw,1.5rem); cursor:pointer;
  color:#ffe9b0; background:rgba(255,190,90,.08);
  border:1px solid rgba(255,200,100,.45); border-radius:999px; padding:.7em 1.4em;
}
#plist button:hover, #plist button:active { background:rgba(255,190,90,.22); }
body.snap #finale h1, body.snap #finale .from, body.snap #finale .names, body.snap #finale #replay {
  animation-duration:.01s !important; animation-delay:0s !important;
}
body.snap * { transition-duration:.01s !important; }
</style>
</head>
<body data-stage="0">
<canvas id="c3d"></canvas>
<div id="hint">A Diwali gift for you</div>
<button id="tapPill">Tap to light the diya</button>
<div id="picker">
  <div class="ptitle">Whose Diwali greeting is this?</div>
  <div id="plist"></div>
</div>
<canvas id="sparkle"></canvas>
<div id="finale">
  <h1>Happy Diwali</h1>
  <div class="from">from</div>
  <div class="names" id="namesLine"></div>
  <button id="replay">Watch again</button>
</div>
<audio id="bgm" src="diwali-song.mp3" loop preload="auto"></audio>
<button id="bgmBtn" title="Music on/off">&#x1F50A;</button>

<script src="three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
